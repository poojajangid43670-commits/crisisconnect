<!DOCTYPE html>
<html>
<head>
    <title>CrisisConnect - Emergency Dispatch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .content { padding: 20px; }
        .brand { color: #e11d48; font-weight: 900; font-size: 22px; text-align: center; display: block; margin-bottom: 5px; }
        .header { text-align: center; font-size: 11px; color: #64748b; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
        .emergency-box { background: #fff1f2; border-left: 5px solid #e11d48; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .info-section { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
        .address { font-weight: bold; font-size: 13px; color: #1e293b; line-height: 1.4; }
        .gps { font-size: 11px; color: #64748b; margin-top: 2px; }
        #map-container { width: 100%; height: 200px; border: none; background: #f1f5f9; }
    </style>
</head>
<body>
<div class="card">
    <div class="content">
        <span class="brand">CrisisConnect</span>
        <div class="header">DISPATCH STATUS</div>
        <div class="emergency-box">
            <div style="font-size: 9px; color: #f43f5e; font-weight: bold;">REPORTED EMERGENCY</div>
            <div style="font-style: italic; font-size: 15px; margin-top: 4px; color: #1e293b;">"ACCIDENT HUA HAI"</div>
        </div>
        <div class="info-section">
            <span style="font-size: 28px;">📍</span>
            <div>
                <div id="address" class="address">Locating live area...</div>
                <div id="gps" class="gps">Waiting for GPS signal...</div>
            </div>
        </div>
    </div>
    <!-- LIVE MAP EMBEDDED INSIDE CARD -->
    <iframe id="map-container" src=""></iframe>
</div>
<script>
    async function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                document.getElementById("gps").innerHTML = `Live GPS locked (${lat.toFixed(6)}, ${lng.toFixed(6)})`;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                    const data = await res.json();
                    document.getElementById("address").innerHTML = data.display_name.split(',').slice(0, 3).join(',');
                } catch (e) { document.getElementById("address").innerHTML = "Location: Jhagadia Area"; }
                const embedUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${lng-0.005},${lat-0.005},${lng+0.005},${lat+0.005}&layer=mapnik&marker=${lat},${lng}`;
                document.getElementById("map-container").src = embedUrl;
            }, (err) => { document.getElementById("address").innerHTML = "Please ALLOW location access!"; }, { enableHighAccuracy: true });
        }
    }
    window.onload = getLocation;
</script>
</body>
</html>
